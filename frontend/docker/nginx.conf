# Production nginx config для SPA (React/Vite)
# — отдача статики, fallback на index.html для client-side routing
# — /api/* → FastAPI (имя upstream `backend` — сервис в docker-compose)

upstream miya_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /api/ {
        proxy_pass http://miya_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш статических ассетов (Vite добавляет хэш в имена)
    location ~* \.(js|css|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Безопасность: скрыть версию nginx
    server_tokens off;
}
