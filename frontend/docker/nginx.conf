# Production nginx config для SPA (React/Vite)
# — отдача статики, fallback на index.html для client-side routing

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш статических ассетов (Vite добавляет хэш в имена)
    location ~* \.(js|css|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Безопасность: скрыть версию nginx
    server_tokens off;
}
