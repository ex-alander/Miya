# Дополнительная проверка RAG-стека на PR (LangChain, FAISS, BM25).
# Полный backend + frontend + Docker: см. ci-cd.yml.
name: CI

on:
  pull_request:
    branches: [main, develop, staging]

jobs:
  rag-pipeline:
    name: RAG pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: RAG imports smoke
        run: python -c "import faiss; import rank_bm25; from app.services.rag_pipeline import hybrid_top_chunks"

      - name: RAG unit tests
        run: pytest tests/test_rag_pipeline.py -v --tb=short
